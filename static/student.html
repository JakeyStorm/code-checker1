<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <title>Student — code-checker1</title>
  <style>
    body{font-family:Arial;margin:20px;max-width:1100px}
    nav{margin-bottom:16px;padding:10px;background:#f5f5f5;border-radius:8px}
    button{padding:8px 14px;cursor:pointer;margin-right:10px}
    textarea{width:100%;height:280px;font-family:Consolas,monospace;font-size:14px}
    pre{background:#f4f4f4;padding:10px;border-radius:8px;white-space:pre-wrap}
    .ok{color:green;font-weight:bold}
    .bad{color:#b00020;font-weight:bold}
  </style>
</head>
<body>

<nav>
  <a href="/teacher"><button>Перейти в Teacher</button></a>
</nav>

<h2>Student</h2>

<textarea id="code">print("hello")</textarea><br>
<button onclick="check()">Проверить</button>

<h3>Результат</h3>
<div id="status"></div>
<ul id="checks"></ul>

<h3>Баллы</h3>
<pre id="score"></pre>

<h3>stdout</h3>
<pre id="stdout"></pre>

<h3>message/stderr</h3>
<pre id="stderr"></pre>

<script>
async function check(){
  const code = document.getElementById("code").value;
  const r = await fetch("/api/check", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({code})
  });
  const data = await r.json();

  const allPass = (data.prints || []).every(p => p.pass);
  const st = document.getElementById("status");
  st.className = allPass ? "ok" : "bad";
  st.textContent = allPass ? "✅ Пройдено" : "❌ Не пройдено";

  const ul = document.getElementById("checks");
  ul.innerHTML = "";
  (data.prints || []).forEach(p => {
    const li = document.createElement("li");
    li.textContent = (p.pass ? "✅ " : "❌ ") + p.message + (p.score ? ` (+${p.score})` : "");
    ul.appendChild(li);
  });

  document.getElementById("score").textContent = String(data.score ?? "");
  document.getElementById("stdout").textContent = data.result || "";
  document.getElementById("stderr").textContent = (data.message || "");
}
</script>

</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <title>Teacher — code-checker1</title>
  <style>
    body{font-family:Arial;margin:20px;max-width:1100px}
    nav{margin-bottom:16px;padding:10px;background:#f5f5f5;border-radius:8px}
    button{padding:8px 14px;cursor:pointer;margin-right:10px}
    textarea{width:100%;font-family:Consolas,monospace;font-size:14px}
    .box{border:1px solid #ddd;border-radius:8px;padding:10px;margin-bottom:12px}
    h3{margin:0 0 8px 0}
  </style>
</head>
<body>

<nav>
  <a href="/"><button>Перейти в Student</button></a>
</nav>

<h2>Teacher</h2>

<div class="box">
  <h3>Unit-тест (JS)</h3>
  <textarea id="test" style="height:320px;"></textarea><br>
  <button onclick="saveTest()">Сохранить тест</button>
</div>

<div class="box">
  <h3>Эталонный код (Python)</h3>
  <textarea id="ref" style="height:260px;"></textarea><br>
  <button onclick="saveRef()">Сохранить эталон</button>
</div>

<script>
async function loadAll(){
  const t = await (await fetch("/api/test")).json();
  document.getElementById("test").value = t.test || "";

  const r = await (await fetch("/api/reference")).json();
  document.getElementById("ref").value = r.reference || "";
}

async function saveTest(){
  await fetch("/api/test", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({test: document.getElementById("test").value})
  });
  alert("Тест сохранён");
}

async function saveRef(){
  await fetch("/api/reference", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({reference: document.getElementById("ref").value})
  });
  alert("Эталон сохранён");
}

loadAll();
</script>

</body>
</html>
